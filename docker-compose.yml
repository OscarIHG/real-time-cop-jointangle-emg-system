services:
  cop-emg-system:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./sessions:/app/sessions
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/dbus:/run/dbus:ro
    # Camera and USB force-plate devices are intentionally not hard-coded:
    # add --device mappings for the host's actual /dev/videoN and USB path.
    restart: unless-stopped
